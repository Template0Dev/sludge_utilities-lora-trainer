[project]
name = "lora-trainer"
version = "0.1.0"
description = "CLI trainer for PEFT LoRA adapters with Unsloth multimodal datasets."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pillow>=10.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "typer>=0.12.0",
]

[project.scripts]
lora-trainer = "lora_trainer.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
gpu = [
    "datasets>=2.20.0",
    "peft>=0.13.0",
    "transformers>=4.50.0",
    "trl>=0.15.0",
    "unsloth>=2025.0.0",
    "kernels<0.15.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
