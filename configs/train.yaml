model:
  id: Qwen/Qwen3.6-35B-A3B-FP8

dataset:
  input_dir: input
  archive:
  extracted_root: .cache/datasets

output:
  adapter_root: output/adapters
  overwrite: false

lora:
  precision: bf16
  r: 16
  alpha: 16
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - gate_up_proj

training:
  batch_size: 1
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  max_steps: 60
  learning_rate: 0.0002
  seed: 3407
  qlora_4bit: false
  unsloth_moe_backend:

export:
  mode: adapter_only
