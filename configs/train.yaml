model:
  id: Qwen/Qwen3.6-35B-A3B

dataset:
  input_dir: input
  archive:
  extracted_root: .cache/datasets

output:
  adapter_root: output/adapters
  overwrite: false

lora:
  precision: bf16
  r: 16
  alpha: 16
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - gate_up_proj

training:
  batch_size: 1
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  max_seq_length: 2048
  max_steps: 486
  learning_rate: 0.0002
  seed: 3407
  qlora_4bit: false
  save_percentage: 10.0
  # Early stopping settings (requires validation split in dataset)
  # early_stopping: true
  # early_stopping_patience: 3
  # early_stopping_threshold: 0.0
  # eval_strategy: "steps"
  # eval_steps: 50
  # save_steps: 50
  # save_total_limit: 1
  resize: "max"
  resize_dimension: "max"
  unsloth_moe_backend:
  attn_implementation:
  set_unsloth_env_flags: true
  unsloth_env_flags:
    UNSLOTH_RETURN_LOGITS: "1"
    UNSLOTH_COMPILE_DISABLE: "1"
    UNSLOTH_DISABLE_FAST_GENERATION: "1"
    UNSLOTH_ENABLE_LOGGING: "1"
    UNSLOTH_FORCE_FLOAT32: "1"
    UNSLOTH_STUDIO_DISABLED: "1"
    UNSLOTH_COMPILE_DEBUG: "1"
    UNSLOTH_COMPILE_MAXIMUM: "0"
    UNSLOTH_COMPILE_IGNORE_ERRORS: "1"
    UNSLOTH_FULLGRAPH: "0"
    UNSLOTH_DISABLE_AUTO_UPDATES: "1"


export:
  mode: adapter_only
